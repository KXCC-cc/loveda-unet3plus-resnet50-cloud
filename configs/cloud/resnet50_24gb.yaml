_base_: ../loveda_4060_resnet50.yaml

# 24GB 及以上云 GPU：物理 batch=2，accumulation=8，
# effective batch 仍为16，保持与16GB配置相同的优化器语义。
run:
  name: cloud_resnet50_24gb
  output_dir: runs/cloud_resnet50_24gb

data:
  loader:
    batch_size: 2
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2

training:
  max_iters: 15000
  accumulation_steps: 8

validation:
  interval_epochs: 2
  patch_batch_size: 2

runtime:
  amp: true
  cudnn_benchmark: true
  channels_last: true
  compile: false
